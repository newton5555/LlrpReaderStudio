<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#091026"/>
      <stop offset="40%" stop-color="#0F172A"/>
      <stop offset="80%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0A1628"/>
    </linearGradient>

    <!-- Glowing Waves Gradient -->
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#67E8F9"/>
      <stop offset="50%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>

    <!-- Glass Panel Bezel Gradient -->
    <linearGradient id="panelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>

    <!-- RFID Tag Gradient -->
    <linearGradient id="tagGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>

    <!-- Gloss Top Shine -->
    <linearGradient id="glossGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="35%" stop-color="#FFFFFF" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <!-- Rim Stroke Gradient -->
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.75"/>
      <stop offset="50%" stop-color="#1E293B" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0.6"/>
    </linearGradient>
  </defs>

  <!-- Squircle Base Container -->
  <rect x="64" y="64" width="896" height="896" rx="212" fill="url(#bgGrad)"/>
  <rect x="64" y="64" width="896" height="896" rx="212" fill="url(#glossGrad)"/>
  <rect x="64" y="64" width="896" height="896" rx="212" fill="none" stroke="url(#rimGrad)" stroke-width="8"/>

  <!-- Background Tech Grid Lines (Subtle Vector Grid) -->
  <g opacity="0.08" stroke="#38BDF8" stroke-width="2" stroke-dasharray="10 10">
    <line x1="200" y1="200" x2="824" y2="200" />
    <line x1="200" y1="360" x2="824" y2="360" />
    <line x1="200" y1="520" x2="824" y2="520" />
    <line x1="200" y1="680" x2="824" y2="680" />
    <line x1="200" y1="824" x2="824" y2="824" />
    <line x1="200" y1="200" x2="200" y2="824" />
    <line x1="360" y1="200" x2="360" y2="824" />
    <line x1="520" y1="200" x2="520" y2="824" />
    <line x1="680" y1="200" x2="680" y2="824" />
    <line x1="824" y1="200" x2="824" y2="824" />
  </g>

  <!-- RFID Waves (Top Radiation Arcs) -->
  <g fill="none" stroke-linecap="round">
    <!-- Arc 3 (Outer Wave) -->
    <path d="M 230 370 A 320 195 0 0 1 794 370" stroke="url(#waveGrad)" stroke-width="24" opacity="0.75"/>
    <!-- Arc 2 (Middle Wave) -->
    <path d="M 300 425 A 240 145 0 0 1 724 425" stroke="url(#waveGrad)" stroke-width="28" opacity="0.9"/>
    <!-- Arc 1 (Inner Wave) -->
    <path d="M 370 480 A 160 95 0 0 1 654 480" stroke="#A5F3FC" stroke-width="32"/>
  </g>

  <!-- Reader Body Panel -->
  <g>
    <!-- Shadow plate -->
    <rect x="236" y="476" width="552" height="340" rx="44" fill="#030712" opacity="0.5"/>
    <!-- Main Console Plate -->
    <rect x="236" y="470" width="552" height="340" rx="44" fill="url(#panelGrad)" stroke="#334155" stroke-width="4"/>
    <rect x="236" y="470" width="552" height="340" rx="44" fill="none" stroke="#38BDF8" stroke-width="3" opacity="0.5"/>

    <!-- Bezel Screen Window -->
    <rect x="276" y="510" width="472" height="150" rx="28" fill="#060913" stroke="#1E293B" stroke-width="3"/>

    <!-- Spectrum Bars -->
    <g opacity="0.9">
      <rect x="312" y="550" width="16" height="70" rx="8" fill="#0284C7"/>
      <rect x="340" y="570" width="16" height="50" rx="8" fill="#0369A1"/>
      <rect x="368" y="535" width="16" height="85" rx="8" fill="#38BDF8"/>
      <rect x="396" y="560" width="16" height="60" rx="8" fill="#0284C7"/>
      <rect x="424" y="540" width="16" height="80" rx="8" fill="#22D3EE"/>
      <rect x="452" y="580" width="16" height="40" rx="8" fill="#0369A1"/>
      <rect x="480" y="530" width="16" height="90" rx="8" fill="#38BDF8"/>
      <rect x="508" y="565" width="16" height="55" rx="8" fill="#0284C7"/>
      <rect x="536" y="545" width="16" height="75" rx="8" fill="#22D3EE"/>
      <rect x="564" y="585" width="16" height="35" rx="8" fill="#0369A1"/>
      <rect x="592" y="555" width="16" height="65" rx="8" fill="#0284C7"/>
    </g>

    <!-- Floating RFID Tag Badge -->
    <g transform="translate(636, 532)">
      <rect x="0" y="0" width="86" height="104" rx="20" fill="url(#tagGrad)"/>
      <rect x="12" y="12" width="62" height="80" rx="12" fill="none" stroke="#FFFFFF" stroke-width="4" opacity="0.95"/>
      <rect x="24" y="24" width="38" height="56" rx="8" fill="none" stroke="#FFFFFF" stroke-width="4" opacity="0.75"/>
      <rect x="35" y="44" width="16" height="16" rx="4" fill="#FFFFFF"/>
    </g>

    <!-- Bottom Status LED Bar -->
    <rect x="276" y="686" width="472" height="84" rx="22" fill="#0A0F1D"/>

    <!-- LED 1: Power (Green) -->
    <circle cx="340" cy="728" r="18" fill="#10B981"/>
    <circle cx="340" cy="728" r="8" fill="#A7F3D0"/>
    <path d="M 340 716 V 724 M 334 722 A 8 8 0 1 0 346 722" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" fill="none"/>

    <!-- LED 2: RF Scanning (Cyan) -->
    <circle cx="512" cy="728" r="18" fill="#38BDF8"/>
    <circle cx="512" cy="728" r="8" fill="#E0F2FE"/>
    <path d="M 504 724 A 8 8 0 0 1 520 724 M 507 728 A 5 5 0 0 1 517 728" stroke="#0F172A" stroke-width="2.5" stroke-linecap="round" fill="none"/>

    <!-- LED 3: Data Stream (Indigo) -->
    <circle cx="684" cy="728" r="18" fill="#818CF8"/>
    <circle cx="684" cy="728" r="8" fill="#EEF2FF"/>
    <path d="M 678 724 H 690 M 686 720 L 690 724 L 686 728 M 690 732 H 678 M 682 728 L 678 732 L 682 736" stroke="#0F172A" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  </g>
</svg>
